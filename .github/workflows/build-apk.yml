name: Compilare APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generează proiectul Android și îl configurează
        run: |
          flutter --version
          flutter create . --platforms android --org md.vmsmoldova --project-name vms_moldova
          dart run tool/setup_android.dart

      - name: Cheia de semnare (doar dacă ai adăugat secretele)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$RUNNER_TEMP/upload.jks"
            } > android/key.properties
            echo "Semnare cu cheia ta de release."
          else
            echo "Fără secrete: APK semnat cu cheie de test (bun pentru instalare pe telefon, nu pentru Google Play)."
          fi

      - name: Date la zi incluse în APK
        run: cp data/vms_data.json assets/data/vms_data.json

      - name: Firebase (doar dacă ai adăugat secretul GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Fără GOOGLE_SERVICES_JSON: APK fără notificări despre licitații (alertele de scadență funcționează)."
            : > "$RUNNER_TEMP/firebase-defines.txt"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          if ! python3 - "$RUNNER_TEMP/google-services.json" > "$RUNNER_TEMP/firebase-defines.txt" <<'PY'
          import json, sys
          g = json.load(open(sys.argv[1]))
          pkg = "md.vmsmoldova.app"
          client = next((c for c in g["client"] if c["client_info"]["android_client_info"]["package_name"] == pkg), None)
          if client is None:
              sys.exit(f"google-services.json nu conține aplicația Android {pkg}")
          vals = {
              "FIREBASE_API_KEY": client["api_key"][0]["current_key"],
              "FIREBASE_APP_ID": client["client_info"]["mobilesdk_app_id"],
              "FIREBASE_SENDER_ID": g["project_info"]["project_number"],
              "FIREBASE_PROJECT_ID": g["project_info"]["project_id"],
          }
          print(" ".join(f"--dart-define={k}={v}" for k, v in vals.items()))
          PY
          then
            echo "::warning::GOOGLE_SERVICES_JSON nu a putut fi citit – APK compilat fără notificări despre licitații."
            : > "$RUNNER_TEMP/firebase-defines.txt"
            exit 0
          fi
          echo "Firebase configurat pentru proiectul $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_info"]["project_id"])' "$RUNNER_TEMP/google-services.json")."

      - name: Dependențe, analiză, teste, compilare
        id: build
        run: |
          set -o pipefail
          {
            echo "=== flutter pub get ==="
            flutter pub get
            echo "=== flutter analyze ==="
            flutter analyze --no-fatal-infos --no-fatal-warnings || echo "ANALYZE_FAILED"
            echo "=== flutter test ==="
            flutter test || echo "TESTS_FAILED"
            echo "=== flutter build apk ==="
            flutter build apk --release $(cat "$RUNNER_TEMP/firebase-defines.txt") \
              --build-number=${{ github.run_number }} \
              --dart-define=APP_BUILD=${{ github.run_number }} \
              --dart-define=GITHUB_REPO=${{ github.repository }} \
              --dart-define=VMS_DATA_URL=https://raw.githubusercontent.com/${{ github.repository }}/main/data/vms_data.json
          } 2>&1 | tee "$RUNNER_TEMP/build-log.txt"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/vms-moldova-${{ github.run_number }}.apk"

      - name: Publică APK-ul (Releases)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: VMS Moldova – compilarea ${{ github.run_number }}
          prerelease: false
          make_latest: true
          body: |
            APK compilat automat din commit-ul ${{ github.sha }}.
            Descarcă fișierul .apk de mai jos direct pe telefon și instalează-l.
            Se instalează peste versiunea existentă (aceeași cheie de semnare), fără ștergere.
          files: ${{ runner.temp }}/vms-moldova-${{ github.run_number }}.apk

      - name: Salvează jurnalul compilării în ramura build-logs
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/build-log.txt" ] || echo "jurnal lipsă" > "$RUNNER_TEMP/build-log.txt"
          git config user.name "vms-build-bot"
          git config user.email "vms-build-bot@users.noreply.github.com"
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . || true
          cp "$RUNNER_TEMP/build-log.txt" build-log.txt
          echo "run=${{ github.run_number }} status=${{ steps.build.outcome }} sha=${{ github.sha }}" > build-status.txt
          git add -f build-log.txt build-status.txt
          git commit -m "jurnal compilare ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -f origin build-logs
