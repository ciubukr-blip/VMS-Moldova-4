name: Actualizare date MF

on:
  schedule:
    # Zilele de licitație (marți = BT, miercuri = OS): la fiecare 5 minute, 09:00–18:55 ora Chișinăului
    - cron: "*/5 6-15 * * 2,3"
    # Restul zilelor: de două ori pe zi (calendare noi, comunicate de plasare)
    - cron: "23 6,13 * * 0,1,4,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vms-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements.txt
      - run: pip install -r data_pipeline/requirements.txt
      - name: Teste parsere
        working-directory: data_pipeline
        run: python -m unittest discover -s tests -t .
      - name: Preluare, validare, publicare
        id: build
        continue-on-error: true
        working-directory: data_pipeline
        run: python -m vms_pipeline.build
      - name: Commit dacă s-au schimbat datele
        run: |
          git config user.name "vms-data-bot"
          git config user.email "vms-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Fără modificări"
          else
            git commit -m "date: actualizare automată $(date -u +%Y-%m-%dT%H:%MZ)"
            # dacă între timp s-a făcut alt push pe main, integrăm și reîncercăm
            for i in 1 2 3 4 5; do
              git push && break
              echo "push respins – rebase și reîncercare ($i)"
              sleep $((i * 5))
              git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            done
          fi
      - name: Semnalează eșecul validării (primești e-mail de la GitHub)
        if: steps.build.outcome == 'failure'
        run: exit 1
