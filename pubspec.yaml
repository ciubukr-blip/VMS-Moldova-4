name: vms_moldova
description: VMS Moldova - grafice, licitatii si portofoliu
publish_to: none
version: 3.1.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.2
  intl: any            # versiunea este fixată de flutter_localizations
  url_launcher: ^6.3.1
  http: ^1.2.2
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: ^19.4.0
  timezone: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/vms_data.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
